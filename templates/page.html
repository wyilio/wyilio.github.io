{% extends "index.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<article class="post">
    <header>
        <h1>{{ page.title }}</h1>
    </header>
    <div class="content">
        {{ page.content | safe }}
    </div>

    {{ <page_info page={page} config={config} /> }}
</article>

{% endblock content %}
